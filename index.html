<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة عصام صاصا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="google-site-verification" content="RrPqRA9u1kUjJMMek4fDV83MjTD81LRy34YlM1D5KDc" />
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(17, 22, 34, 0.85);
            --primary-color: #e11d48;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --warning-bg: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(rgba(11, 14, 20, 0.8), rgba(11, 14, 20, 0.85)), 
                        url('sasa.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            padding: 0 20px 20px 20px;
            min-height: 100vh;
        }

        /* شريط التنبيه أعلى الصفحة */
        .notice-banner {
            background: var(--warning-bg);
            color: #000;
            text-align: center;
            padding: 10px 15px;
            font-weight: 700;
            font-size: 0.95rem;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .logo-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .header-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.6);
        }

        .main-container {
            max-width: 1050px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .playlist-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            position: relative;
            margin-bottom: 10px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px 10px 35px;
            background: rgba(22, 27, 38, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .songs-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .songs-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .section-header {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .song-item {
            background: rgba(22, 27, 38, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .song-item:hover, .song-item.active {
            border-color: var(--primary-color);
            background: rgba(225, 29, 72, 0.2);
        }

        .song-item.active {
            box-shadow: 0 0 10px rgba(225, 29, 72, 0.3);
        }

        .song-text {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .player-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
        }

        .display-card {
            width: 100%;
            background: rgba(22, 27, 38, 0.8);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .display-card i.disc-icon {
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .display-card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .video-box {
            width: 100%;
            height: 220px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            display: none;
            border: 1px solid var(--border-color);
        }

        .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .ctrl-btn {
            background: var(--primary-color);
            border: none;
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            transition: 0.2s;
        }

        .ctrl-btn:hover {
            transform: scale(1.1);
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
        }

        .btn-play { background: var(--accent-green); }
        .btn-download { background: var(--accent-blue); }

        @media (max-width: 768px) {
            .main-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- شريط التنبيه -->
    <div class="notice-banner">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>تنبيه: الموقع لسه تحت الإنشاء</span>
    </div>

    <header>
        <h1 class="logo-title">منصة عصام صاصا</h1>
        <img src="logo.png" alt="عصام صاصا" class="header-logo">
    </header>

    <div class="main-container">
        <div class="playlist-section">
            <div class="section-header">
                <span><i class="fa-solid fa-list-ul"></i> اختر مهرجان</span>
                <span id="songsCount" style="font-size:0.8rem; color:#9ca3af;"></span>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن مهرجان..." onkeyup="filterSongs()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="songs-list" id="playlist"></div>
        </div>

        <div class="player-section">
            <div class="display-card">
                <i id="discIcon" class="fa-solid fa-compact-disc fa-spin-pulse disc-icon"></i>
                
                <div class="video-box" id="videoBox">
                    <iframe id="youtubePlayer" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>

                <h3 id="currentSongTitle">اختر أغنية للتشغيل</h3>

                <audio id="audioPlayer" controls style="display:none;"></audio>

                <div class="player-controls">
                    <button class="ctrl-btn" onclick="prevSong()" title="المهرجان السابق">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                    <button class="ctrl-btn" onclick="nextSong()" title="المهرجان التالي">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                </div>
            </div>

            <div class="action-btns">
                <a id="playLink" href="#" target="_blank" class="btn btn-play">
                    <i class="fa-brands fa-youtube"></i> فتح على يوتيوب
                </a>
                <a id="downloadLink" href="#" target="_blank" class="btn btn-download">
                    <i class="fa-solid fa-download"></i> بحث وتحميل MP3
                </a>
            </div>
        </div>
    </div>

    <script>
        const songsData = [
            { 
                title: "صحي الاخصام بطلقه (خلصانه يا ابن جهتي)", 
                query: "عصام صاصا صحي الاخصام بطلقه", 
                videoId: "Zhvvo75ldnk", 
                mp3Url: "" 
            },
            { 
                title: "مهرجان واقع وسط العقارب", 
                query: "عصام صاصا واقع وسط العقارب", 
                videoId: "92q91stFQcc", 
                mp3Url: "" 
            },
            { 
                title: "كليب في يوم فراقك (كل اللي باعني وقال فارقني)", 
                query: "عصام صاصا كليب في يوم فراقك", 
                videoId: "43YkA8otY-I", 
                mp3Url: "" 
            },
            { title: "كوكب اشرار (اقعد مع كاسك اشرب واسكر طير راسك)", query: "عصام صاصا كوكب اشرار" },
            { title: "تعبان جدا مش قادر (يا دموع عينيا كفايه)", query: "عصام صاصا تعبان جدا مش قادر" },
            { title: "قنبلة يخربيتك مشكله", query: "عصام صاصا قنبلة يخربيتك مشكله" },
            { title: "لما اخويا حبيبي غاب (شبل خان في معلمه)", query: "عصام صاصا لما اخويا حبيبي غاب" },
            { title: "مجرم غصب عني يا قاضي", query: "عصام صاصا مجرم غصب عني يا قاضي" },
            { title: "عاشق الموت (هو انتي ايه قلبي ده جيتي انتي خطفتي)", query: "عصام صاصا عاشق الموت" },
            { title: "يا صاحبي خد بالك قصاد منك كلاب واقفين", query: "عصام صاصا يا صاحبي خد بالك" },
            { title: "منجايه بلدي تزعل في بعدي", query: "عصام صاصا منجايه بلدي" },
            { title: "الصح صح لكن مع الوحشين غلط", query: "عصام صاصا الصح صح" },
            { title: "هدي في قلبك طلقه (لو عوزت تكلمني)", query: "عصام صاصا هدي في قلبك طلقه" },
            { title: "خد كشاف", query: "عصام صاصا خد كشاف" },
            { title: "أنا المفتري", query: "عصام صاصا انا المفتري" },
            { title: "حبيتها يا ناس حطيتها فقلبي خلاص", query: "عصام صاصا حبيتها يا ناس" },
            { title: "تكرهلي الخير هكره امك", query: "عصام صاصا تكرهلي الخير هكره امك" },
            { title: "ورق خلا قلوب الناس تتحرق", query: "عصام صاصا ورق خلا قلوب الناس تتحرق" },
            { title: "اه لو دول اصحاب", query: "عصام صاصا اه لو دول اصحاب" },
            { title: "ملامح وشي مش هي", query: "عصام صاصا ملامح وشي مش هي" },
            { title: "انا مخنوق من كل الدنيا", query: "عصام صاصا انا مخنوق من كل الدنيا" },
            { title: "سجاره في سجاره لابس نضاره", query: "عصام صاصا سجاره في سجاره لابس نضاره" },
            { title: "انتو قلوبكم مش بتحب", query: "عصام صاصا انتو قلوبكم مش بتحب" },
            { title: "ندمان عارف يا باشا", query: "عصام صاصا ندمان عارف يا باشا" },
            { title: "انتي حبك تمثليه - بالاونطه كله غلطه", query: "عصام صاصا انتي حبك تمثليه" },
            { title: "مسجون انا مش متخيل", query: "عصام صاصا مسجون انا مش متخيل" },
            { title: "اسمع حضرت يابني انا جيت", query: "عصام صاصا اسمع حضرت يابني انا جيت" },
            { title: "لحالي هعيش", query: "عصام صاصا لحالي هعيش" },
            { title: "عره فافي عامل مغامر", query: "عصام صاصا عره فافي عامل مغامر" },
            { title: "شكرا اوي للي باعوا (شايل السلاح)", query: "عصام صاصا شكرا اوي للي باعوا" },
            { title: "مش فاكر ليكو ولا ميزه (زمان كان ليكو هيبه)", query: "عصام صاصا مش فاكر ليكو ولا ميزه" },
            { title: "فين الخصم اللي يبارزني", query: "عصام صاصا فين الخصم اللي يبارزني" },
            { title: "قلبي انا هكتب عليه مقفول", query: "عصام صاصا قلبي انا هكتب عليه مقفول" },
            { title: "الدنيا دي غابه وخلايق كدابه", query: "عصام صاصا الدنيا دي غابه وخلايق كدابه" },
            { title: "لو حد قالك اني بايعك لا تراجعو", query: "عصام صاصا لو حد قالك اني بايعك" },
            { title: "معروف انا مين (الأسد العادي)", query: "عصام صاصا معروف انا مين" },
            { title: "مات الكلام مع الخاينين", query: "عصام صاصا مات الكلام مع الخاينين" },
            { title: "ايه يا زميلي مين ده اللي كاسر عينك", query: "عصام صاصا ايه يا زميلي مين ده اللي كاسر عينك" },
            { title: "لو الموت يا صاحبي خدني", query: "عصام صاصا لو الموت يا صاحبي خدني" },
            { title: "ياريت الموت يجي يريحني", query: "عصام صاصا ياريت الموت يجي يريحني" },
            { title: "نص المقابر زمايلي واصحابي", query: "عصام صاصا نص المقابر زمايلي واصحابي" },
            { title: "صايع وشراني وسوابق", query: "عصام صاصا صايع وشراني وسوابق" },
            { title: "كل الطرق مقفوله قدامي", query: "عصام صاصا كل الطرق مقفوله قدامي" },
            { title: "انتو مين يالي جيتو عليا", query: "عصام صاصا انتو مين يالي جيتو عليا" },
            { title: "طالعين فيها شياطين", query: "عصام صاصا طالعين فيها شياطين" },
            { title: "مش خايف من الموت", query: "عصام صاصا مش خايف من الموت" },
            { title: "انا قلبي في غيبوبه", query: "عصام صاصا انا قلبي في غيبوبه" },
            { title: "جرحي كبير يا خلق عادي", query: "عصام صاصا جرحي كبير يا خلق عادي" },
            { title: "عايش في عالم مليان كدابين", query: "عصام صاصا عايش في عالم مليان كدابين" }
        ];

        let currentIndex = 0;
        let currentFilteredSongs = [...songsData];

        function renderPlaylist(list = songsData) {
            const container = document.getElementById('playlist');
            document.getElementById('songsCount').innerText = `(${list.length} مهرجان)`;
            
            if(list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#6b7280;">لا توجد نتائج</div>';
                return;
            }

            container.innerHTML = list.map((song, index) => `
                <div class="song-item ${index === currentIndex ? 'active' : ''}" onclick="selectSongByIndex(${index})">
                    <span class="song-text">${song.title}</span>
                    <i class="fa-regular fa-circle-play"></i>
                </div>
            `).join('');

            if(list.length > 0 && currentIndex < list.length) {
                loadSongData(list[currentIndex]);
            }
        }

        function selectSongByIndex(index) {
            currentIndex = index;
            renderPlaylist(currentFilteredSongs);
        }

        function loadSongData(song) {
            document.getElementById('currentSongTitle').innerText = song.title;

            const youtubeIframe = document.getElementById('youtubePlayer');
            const audioPlayer = document.getElementById('audioPlayer');
            const videoBox = document.getElementById('videoBox');
            const discIcon = document.getElementById('discIcon');

            if (song.videoId) {
                youtubeIframe.src = `https://www.youtube.com/embed/${song.videoId}?autoplay=1`;
                videoBox.style.display = 'block';
                discIcon.style.display = 'none';
            } else {
                youtubeIframe.src = '';
                videoBox.style.display = 'none';
                discIcon.style.display = 'inline-block';
            }

            if (song.mp3Url) {
                audioPlayer.src = song.mp3Url;
                audioPlayer.style.display = 'block';
            } else {
                audioPlayer.pause();
                audioPlayer.style.display = 'none';
            }

            const youtubeSearch = song.videoId 
                ? `https://www.youtube.com/watch?v=${song.videoId}` 
                : `https://www.youtube.com/results?search_query=${encodeURIComponent(song.query)}`;
                
            const downloadSearch = `https://y2mate.is/search?q=${encodeURIComponent(song.query)}`;
            
            document.getElementById('playLink').href = youtubeSearch;
            document.getElementById('downloadLink').href = downloadSearch;
        }

        function nextSong() {
            if (currentIndex < currentFilteredSongs.length - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            renderPlaylist(currentFilteredSongs);
        }

        function prevSong() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = currentFilteredSongs.length - 1;
            }
            renderPlaylist(currentFilteredSongs);
        }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            currentFilteredSongs = songsData.filter(s => s.title.toLowerCase().includes(query));
            currentIndex = 0;
            renderPlaylist(currentFilteredSongs);
        }

        renderPlaylist();
    </script>
</body>
</html>
